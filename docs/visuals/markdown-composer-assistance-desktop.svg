<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">On Track Markdown assistance panel, desktop concept</title>
  <desc id="desc">The existing On Track project workspace with a compact single-row Markdown formatting strip expanded inside the composer above selected text.</desc>
  <defs>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17191c; }
      .muted { fill: #626a75; }
      .tiny { font-size: 11px; }
      .small { font-size: 13px; }
      .body { font-size: 15px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .strong { font-weight: 700; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f6f7f9"/>

  <!-- Existing project rail -->
  <rect x="0" y="0" width="300" height="900" fill="#eef1f4"/>
  <line x1="299.5" y1="0" x2="299.5" y2="900" stroke="#e8ebef"/>
  <line x1="0" y1="68" x2="300" y2="68" stroke="#e8ebef"/>
  <text class="ui strong" x="18" y="28" font-size="16">On Track</text>
  <text class="ui muted tiny" x="18" y="49">Private project threads</text>
  <rect x="250" y="15" width="38" height="38" rx="9" fill="#fff" stroke="#d8dde3"/>
  <path d="M269 25v18M260 34h18" stroke="#17191c" stroke-width="1.8" stroke-linecap="round"/>
  <text class="ui muted label" x="18" y="99">PROJECTS</text>
  <text class="ui muted label" x="266" y="99" text-anchor="end">01</text>
  <rect x="7" y="108" width="281" height="58" rx="9" fill="#f8fafc"/>
  <rect x="7" y="119" width="3" height="36" rx="1.5" fill="#33758c"/>
  <text class="ui strong small" x="18" y="134">Release planning</text>
  <text class="ui muted tiny" x="18" y="153">Table syntax and launch criteria</text>
  <line x1="0" y1="838" x2="300" y2="838" stroke="#e8ebef"/>
  <circle cx="21" cy="866" r="4" fill="#397044"/>
  <text class="ui strong small" x="36" y="865">Local only</text>
  <text class="ui muted tiny" x="36" y="882">Not encrypted yet</text>
  <rect x="250" y="847" width="38" height="38" rx="9" fill="#fff" stroke="#d8dde3"/>
  <circle cx="269" cy="866" r="6" fill="none" stroke="#626a75" stroke-width="1.7"/>
  <path d="M269 855v3M269 874v3M258 866h3M277 866h3" stroke="#626a75" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Existing workspace header and filters -->
  <rect x="300" y="0" width="1140" height="64" fill="#fff"/>
  <line x1="300" y1="63.5" x2="1440" y2="63.5" stroke="#e8ebef"/>
  <text class="ui strong" x="504" y="39" font-size="18">Release planning</text>
  <rect x="1302" y="14" width="89" height="36" rx="8" fill="#fff" stroke="#d8dde3"/>
  <path d="M1320 37l2-7 8-8 4 4-8 8-6 3z" fill="none" stroke="#17191c" stroke-width="1.5" stroke-linejoin="round"/>
  <text class="ui small" x="1342" y="37">Edit</text>

  <rect x="300" y="64" width="128" height="836" fill="#f6f7f9"/>
  <rect x="307" y="78" width="108" height="44" rx="8" fill="#fff"/>
  <rect x="307" y="86" width="3" height="28" rx="1.5" fill="#33758c"/>
  <text class="ui small strong" x="333" y="104">All</text><circle cx="397" cy="99" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="103" text-anchor="middle">3</text>
  <text class="ui muted small" x="333" y="153">Files</text><circle cx="397" cy="148" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="152" text-anchor="middle">0</text>
  <text class="ui muted small" x="333" y="202">Pin</text><circle cx="397" cy="197" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="201" text-anchor="middle">0</text>
  <text class="ui muted small" x="333" y="251">Alert</text><circle cx="397" cy="246" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="250" text-anchor="middle">0</text>
  <text class="ui muted small" x="333" y="300">Todo</text><circle cx="397" cy="295" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="299" text-anchor="middle">1</text>
  <text class="ui muted small" x="333" y="349">Milestone</text><circle cx="397" cy="344" r="10" fill="#eef1f4"/><text class="ui tiny" x="397" y="348" text-anchor="middle">0</text>

  <!-- Existing history, deliberately quiet around the composer -->
  <text class="ui muted label" x="540" y="120">TODAY</text>
  <rect x="770" y="142" width="530" height="104" rx="14" fill="#e7eef2"/>
  <text class="ui body" x="790" y="173">Decide whether the release table needs an owner column.</text>
  <rect x="790" y="192" width="46" height="20" rx="10" fill="none" stroke="#7f8993"/>
  <text class="ui muted tiny strong" x="813" y="206" text-anchor="middle">Todo</text>
  <text class="ui muted tiny strong" x="1278" y="226" text-anchor="end">10:18</text>
  <rect x="865" y="268" width="435" height="88" rx="14" fill="#e7eef2"/>
  <rect x="885" y="287" width="3" height="38" fill="#7ba3b1"/>
  <text class="ui muted body" x="902" y="307">Launch should wait until the migration check passes.</text>
  <text class="ui muted tiny strong" x="1278" y="339" text-anchor="end">10:24</text>

  <!-- Compact expanded composer -->
  <rect x="428" y="726" width="1012" height="174" fill="#f6f7f9"/>
  <rect x="474" y="744" width="890" height="140" rx="12" fill="#fff" stroke="#33758c" stroke-width="1.5"/>

  <!-- One-row Markdown formatting strip -->
  <rect x="474" y="744" width="890" height="44" rx="12" fill="#fff"/>
  <path d="M474 788h890" stroke="#e8ebef"/>
  <text class="ui muted tiny strong" x="491" y="771">FORMAT</text>
  <g>
    <rect x="548" y="750" width="32" height="32" rx="7" fill="#eef6f8" stroke="#33758c"/>
    <text class="ui strong" x="564" y="771" text-anchor="middle" font-size="14">B</text>
    <rect x="584" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui" x="600" y="771" text-anchor="middle" font-size="14" font-style="italic">I</text>
    <rect x="620" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <path d="M629 768l6-6a4 4 0 016 6l-6 6a4 4 0 01-6-6m8-2l3-3" fill="none" stroke="#626a75" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="656" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui strong" x="672" y="772" text-anchor="middle" font-size="18">“</text>
    <rect x="692" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui" x="708" y="771" text-anchor="middle" font-size="14">•≡</text>
    <rect x="728" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui" x="744" y="771" text-anchor="middle" font-size="12">1≡</text>
    <rect x="764" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui" x="780" y="771" text-anchor="middle" font-size="13">☐</text>
    <rect x="800" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <text class="ui mono strong" x="816" y="771" text-anchor="middle" font-size="12">&lt;/&gt;</text>
    <rect x="836" y="750" width="32" height="32" rx="7" fill="#f8fafc"/>
    <path d="M845 758h14v16h-14zm0 5h14m-7-5v16" fill="none" stroke="#626a75" stroke-width="1.3"/>
  </g>
  <text class="ui strong tiny" x="887" y="771">Bold</text>
  <text class="ui muted mono tiny" x="925" y="771">**text**</text>
  <text class="ui muted tiny" x="982" y="771">⌘B / Ctrl+B</text>
  <text class="ui muted tiny strong" x="1342" y="771" text-anchor="end">ESC</text>

  <!-- Existing textarea + action bar -->
  <rect x="665" y="807" width="76" height="23" rx="3" fill="#dcebf0"/>
  <text class="ui body" x="494" y="825">Release gate needs one owner before Friday.</text>
  <text class="ui muted tiny" x="1115" y="861">⌘/Ctrl + Enter</text>
  <g transform="translate(1192 842)">
    <rect width="36" height="34" rx="8" fill="#eef6f8"/>
    <text class="ui strong" x="18" y="22" text-anchor="middle" font-size="13">M↓</text>
  </g>
  <g transform="translate(1234 842)">
    <rect width="36" height="34" rx="8" fill="transparent"/>
    <path d="M11 18l8-8a5 5 0 017 7l-9 9a4 4 0 01-6-6l9-9" fill="none" stroke="#626a75" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <g transform="translate(1276 842)">
    <rect width="36" height="34" rx="8" fill="transparent"/>
    <circle cx="18" cy="17" r="7" fill="none" stroke="#626a75" stroke-width="1.7"/><path d="M18 12v5l3 2" fill="none" stroke="#626a75" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <rect x="1318" y="840" width="40" height="36" rx="8" fill="#33758c"/>
  <path d="M1330 858h14m-5-5l5 5-5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
