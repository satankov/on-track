name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged source (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22.16.0, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify tag and release contract
        run: npm run release:check
      - name: Run authoritative verification
        run: npm run verify

  managed:
    name: Verify managed platforms
    uses: ./.github/workflows/managed-install.yml

  publish:
    name: Publish GitHub Release
    needs: [verify, managed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use pinned managed Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0
          cache: npm
      - name: Build packaging tools
        run: |
          npm ci
          npm run build
      - name: Verify official private runtime archives
        run: node scripts/verify-managed-runtime.mjs
      - name: Build fixed release assets
        env:
          MANAGED_MINIMUM_VERSION: ${{ vars.MANAGED_MINIMUM_VERSION }}
        run: |
          if [ -z "$MANAGED_MINIMUM_VERSION" ]; then
            echo 'Set MANAGED_MINIMUM_VERSION to the reviewed first protocol-aware release before publishing.' >&2
            exit 1
          fi
          npm run release:managed -- --output "$RUNNER_TEMP/threadstr-managed-assets" --minimum-version "$MANAGED_MINIMUM_VERSION"
      - name: Upload all assets to draft before immutable publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/threadstr-managed-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --notes-file "$RUNNER_TEMP/threadstr-managed-assets/INSTALL.md" \
            --title "threadstr $GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
