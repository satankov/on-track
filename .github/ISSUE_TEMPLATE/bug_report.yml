name: Bug report
description: Report reproducible incorrect behavior without personal data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never attach a real On Track database, export, secret, or NDA material.
        Report security vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: On Track version
      placeholder: 0.0.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use sanitized example data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
