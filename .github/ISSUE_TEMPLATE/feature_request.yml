name: Feature request
description: Propose a focused product improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What personal project-management problem should be easier?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable workflow, not only a technical solution.
    validations:
      required: true
  - type: textarea
    id: data-impact
    attributes:
      label: Data and privacy impact
      description: Note any attachments, imports, exports, sync, or encryption impact.
    validations:
      required: true
